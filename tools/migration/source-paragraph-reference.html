<!doctype html><meta charset="utf-8"><title>原网页 PC 段落对照</title>
<link rel="stylesheet" href="/source/shared/css/style.css">
<script type="importmap">{"imports":{"three":"/source/three/vendor/three/build/three.module.js","three/addons/":"/source/three/vendor/three/addons/","@shared/":"/source/shared/"}}</script>
<div id="ui"><div id="home"></div></div>
<button id="measure" style="position:fixed;right:20px;top:75px;z-index:100">测量原版段落</button>
<pre id="measurements" style="display:none"></pre>
<script type="module">
import {Home} from '/source/shared/ui/home.js';
const home=new Home(document.querySelector('#home'),{},{});
document.body.classList.add('screen-home');home.setTab('workshop');
function measure(element,key){
 const style=getComputedStyle(element),box=element.getBoundingClientRect(),lines=[],runs=[];
 const canvas=document.createElement('canvas').getContext('2d');
 const walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT);
 let node;
 while(node=walker.nextNode()){
  const css=getComputedStyle(node.parentElement);canvas.font=css.font;const m=canvas.measureText(node.data);
  runs.push({text:node.data,font:css.fontFamily,size:parseFloat(css.fontSize),lineHeight:css.lineHeight,width:m.width,ascent:m.fontBoundingBoxAscent,descent:m.fontBoundingBoxDescent});
  for(let i=0;i<node.length;i++){
   const range=document.createRange();range.setStart(node,i);range.setEnd(node,i+1);const r=range.getBoundingClientRect();
   if(r.width===0)continue;
   let line=lines.find(line=>Math.abs(line.top-(r.y-box.y))<8);
   if(!line){line={top:r.y-box.y,text:''};lines.push(line);}
   line.text+=node.data[i];
  }
 }
 return {key,text:element.textContent,width:box.width,height:box.height,box:box.toJSON(),size:parseFloat(style.fontSize),
  lineHeight:style.lineHeight,font:style.fontFamily,color:style.color,lines,runs};
}
document.querySelector('#measure').onclick=async()=>{
 await document.fonts.ready;const samples=[];
 home.setTab('workshop');document.querySelectorAll('.ws-card p').forEach((p,i)=>samples.push(measure(p,'workshop-'+(i+1))));
 home.setTab('battle');document.querySelectorAll('.mode p').forEach((p,i)=>samples.push(measure(p,'mode-'+p.closest('.mode').dataset.mode)));
 home.setTab('shop');samples.push(measure(document.querySelector('.empty-pane p'),'shop'));
 const palette=document.createElement('div');palette.id='colorPop';palette.style.cssText='display:block!important;left:0;top:0;bottom:auto;';
 palette.innerHTML='<div class="lbl">选择颜色进入涂装；不会改变新放零件的配色</div>';document.body.append(palette);
 samples.push(measure(palette.firstChild,'palette'));palette.remove();
 const warn=document.createElement('div');warn.className='ri-warn';warn.style.width='380px';
 warn.innerHTML='<svg class="ic"></svg><span>车辆状态良好，可以出战</span>';document.body.append(warn);samples.push(measure(warn.querySelector('span'),'warning'));warn.remove();
 const canvas=document.createElement('canvas').getContext('2d');
 const mono=['monospace','Consolas','Courier New','Courier','Lucida Console','Cascadia Mono','Fixedsys','Terminal','SimSun'].map(family=>{
  const font='13px '+(family==='monospace'?'monospace':'"'+family+'"');
  canvas.font=font;const m=canvas.measureText('FKZC1:');return {font,width:m.width,ascent:m.fontBoundingBoxAscent,descent:m.fontBoundingBoxDescent};
 });
 document.querySelector('#measurements').textContent=JSON.stringify({viewport:[innerWidth,innerHeight],samples,mono});
 home.setTab('workshop');
};
</script>
