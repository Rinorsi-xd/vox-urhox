<!doctype html><meta charset="utf-8"><title>原网页 PC 字体与换行</title>
<link rel="stylesheet" href="/source/shared/css/style.css">
<script type="importmap">{"imports":{"three":"/source/three/vendor/three/build/three.module.js","three/addons/":"/source/three/vendor/three/addons/","@shared/":"/source/shared/"}}</script>
<div id="ui"><div id="home"></div></div>
<button id="measure" style="position:fixed;left:20px;top:75px;z-index:100">测量原版字体与换行</button>
<pre id="measurements" style="position:fixed;left:20px;top:100px;z-index:100;max-height:45vh;overflow:auto;font:12px monospace"></pre>
<script type="module">
import {Home} from '/source/shared/ui/home.js';
new Home(document.querySelector('#home'),{},{});
document.body.classList.add('screen-home');
if(new URLSearchParams(location.search).has('menu-entry')){
 document.body.style.background='#a0a0a0';
 document.querySelector('#ui').style.display='none';document.querySelector('#measure').style.display='none';
 const parent=document.querySelector('.bay-new');document.body.append(parent);
 parent.style.cssText='position:fixed;left:0;top:0;width:0;height:0;';
 for(const child of parent.children)if(!child.classList.contains('bay-new-menu'))child.style.display='none';
 const menu=parent.querySelector('.bay-new-menu');
 menu.style.cssText='position:fixed;left:160px;top:120px;bottom:auto;width:320px;';
 parent.classList.add('open');
 const animation=menu.getAnimations()[0];animation.pause();animation.currentTime=0;
 const samples=[0,10,25,50,100,150,200];
 const control=document.createElement('select');control.id='menu-time';control.setAttribute('aria-label','原版菜单入场时间');
 control.style.cssText='position:fixed;left:700px;top:30px;z-index:100;';
 for(const time of samples){const option=document.createElement('option');option.value=time;option.textContent=time+' ms';control.append(option);}
 document.body.append(control);
 const report=document.createElement('pre');report.id='menu-motion';report.style.cssText='position:fixed;left:700px;top:70px;';document.body.append(report);
 await document.fonts.ready;
 const measurements=samples.map(time=>{
  animation.currentTime=time;const css=getComputedStyle(menu);
  return {time,opacity:Number(css.opacity),translate:css.translate,box:menu.getBoundingClientRect().toJSON()};
 });
 report.textContent=JSON.stringify(measurements);animation.currentTime=0;
 control.onchange=()=>{animation.currentTime=Number(control.value);};
}
if(new URLSearchParams(location.search).has('shadow')){
 document.querySelector('#ui').style.display='none';document.querySelector('#measure').style.display='none';
 const modal=new URLSearchParams(location.search).get('shadow')==='modal';
 const parent=document.createElement('div');if(modal){parent.id='modal';parent.style.cssText='display:block;background:none;';}document.body.append(parent);
 const e=document.createElement('div');e.className=modal?'card':'bay-new-menu';
 e.style.cssText='display:flex;position:fixed;left:160px;top:120px;bottom:auto;width:320px;height:332.375px;';parent.append(e);
 if(new URLSearchParams(location.search).has('contrast')) document.body.style.background='#a0a0a0';
}
if(new URLSearchParams(location.search).has('specimen')){
 document.querySelector('#home').style.display='none';
 document.body.style.background='#262a31';
 const e=document.createElement('div');e.textContent='从零建造 预制车：赤焰 GT';
 e.style.cssText='position:absolute;left:20px;top:20px;font:400 18px var(--display)';
 document.body.append(e);
}
document.querySelector('#measure').onclick=async event=>{
 event.stopPropagation();
 document.querySelector('.bay-new').classList.add('open');
 await document.fonts.ready;
 const c=document.createElement('canvas').getContext('2d');
 const styles=getComputedStyle(document.body),body=styles.getPropertyValue('--body');
 const texts=['预制赛车：前轮转向、后轮动力，四个轮子带','包边；引擎盖上一把狙击枪、后肩两挺加特','林，T3 精英档。','ABC 0123456789','FKZC1:ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'];
 const metrics=[];
 for(const font of [body,'Consolas, monospace'])for(const text of texts){
  c.font='12px '+font;const m=c.measureText(text);metrics.push({font,text,width:m.width});
 }
 const rows=[];
 for(const e of document.querySelectorAll('.bay-new-menu small')){
  const node=e.firstChild,lines=[],lineTops=[];let y=-1;const box=e.getBoundingClientRect();
  for(let i=0;i<node.length;i++){
   const range=document.createRange();range.setStart(node,i);range.setEnd(node,i+1);
   const r=range.getBoundingClientRect();
   if(Math.abs(r.y-y)>1){lines.push('');lineTops.push(r.y-box.y);y=r.y;}
   lines[lines.length-1]+=node.data[i];
  }
  rows.push({text:e.textContent,lines,lineTops,width:box.width,font:getComputedStyle(e).font});
 }
 const titles=[];
 for(const e of document.querySelectorAll('.bay-new-menu b')){
  const style=getComputedStyle(e);c.font=style.font;
  const m=c.measureText(e.textContent),range=document.createRange();range.selectNodeContents(e);
  titles.push({text:e.textContent,font:style.font,lineHeight:style.lineHeight,
   box:e.getBoundingClientRect().toJSON(),textBox:range.getBoundingClientRect().toJSON(),
   metrics:{width:m.width,ascent:m.actualBoundingBoxAscent,descent:m.actualBoundingBoxDescent,
    fontAscent:m.fontBoundingBoxAscent,fontDescent:m.fontBoundingBoxDescent}});
 }
 const display=[];
 for(const size of [18,24,40])for(const text of ['从零建造','预制车：赤焰 GT','预制车：磐石','导入蓝图码','AV','T3 战车','717 / 1,000','961 / 2,400 kg','138 / 240','3 / 4'])for(const spacing of [0,1]){
  const e=document.createElement('span');e.textContent=text;
  e.style.cssText='position:fixed;left:0;top:0;white-space:pre;font:400 '+size+'px var(--display);letter-spacing:'+spacing+'px;';
  const tabular=/^[0-9]/.test(text);if(tabular)e.style.fontVariantNumeric='tabular-nums';
  document.body.append(e);const box=e.getBoundingClientRect(),glyphs=[];
  for(let i=0;i<text.length;i++){
   const range=document.createRange();range.setStart(e.firstChild,i);range.setEnd(e.firstChild,i+1);
   glyphs.push({text:text[i],x:range.getBoundingClientRect().x-box.x});
  }
  c.font=getComputedStyle(e).font;
  display.push({text,size,spacing,tabular,width:box.width,ascent:c.measureText(text).fontBoundingBoxAscent,glyphs});e.remove();
 }
 const bodyLines=[];
 for(const size of [12,12.5,13,15])for(const lineHeight of [size*1.4,size*1.6,20]){
  const e=document.createElement('div');e.style.cssText='position:fixed;left:0;top:0;white-space:pre;font:'+size+'px/'+lineHeight+'px var(--body);';
  e.textContent='预制赛车：前轮转向，T3 精英档。';
  const mark=document.createElement('i');mark.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline;font-size:0;line-height:0;';e.append(mark);document.body.append(e);
  const box=e.getBoundingClientRect(),range=document.createRange();range.selectNodeContents(e.firstChild);
  c.font=getComputedStyle(e).font;const m=c.measureText(e.firstChild.textContent);
  const glyphs=[];
  for(let i=0;i<e.firstChild.length;i++){
   const r=document.createRange();r.setStart(e.firstChild,i);r.setEnd(e.firstChild,i+1);
   glyphs.push({text:e.firstChild.data[i],x:r.getBoundingClientRect().x-box.x});
  }
  bodyLines.push({text:e.firstChild.textContent,size,lineHeight,glyphs,actualHeight:box.height,baseline:mark.getBoundingClientRect().y-box.y,
   rangeTop:range.getBoundingClientRect().y-box.y,rangeHeight:range.getBoundingClientRect().height,ascent:m.fontBoundingBoxAscent,descent:m.fontBoundingBoxDescent});
  e.remove();
 }
 const richLines=[];
 for(const entry of [
  {name:'hover',id:'hoverInfo',html:'放置 <b>轻型方块</b> · 6 点 <em> 贴在 核心驾驶舱</em>'},
  {name:'toast',className:'toast',html:'已保存战车 ABC 123'}]){
  const e=document.createElement('div');if(entry.id)e.id=entry.id;if(entry.className)e.className=entry.className;
  e.style.cssText='position:fixed;left:0;top:0;opacity:1;white-space:nowrap;max-width:none;padding:0;animation:none;transform:none;';e.style.setProperty('display','block','important');e.innerHTML=entry.html;
  const mark=document.createElement('i');mark.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline;font-size:0;line-height:0;';e.append(mark);document.body.append(e);
  const box=e.getBoundingClientRect();richLines.push({name:entry.name,height:box.height,baseline:mark.getBoundingClientRect().y-box.y,font:getComputedStyle(e).font});e.remove();
 }
 document.querySelector('#measurements').textContent=JSON.stringify({metrics,rows,titles,display,bodyLines,richLines},null,2);
};
</script>
