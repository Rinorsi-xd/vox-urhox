<!doctype html><meta charset="utf-8"><title>原版 PC 蓝图提示与调色板</title>
<link rel="stylesheet" href="/source/shared/css/style.css">
<script type="importmap">{"imports":{"three":"/source/three/vendor/three/build/three.module.js","three/addons/":"/source/three/vendor/three/addons/","@shared/":"/source/shared/"}}</script>
<div id="ui">__SOURCE_DOCK__<div id="modal"></div></div>
<nav style="position:fixed;top:8px;right:8px;z-index:100"><button id="import">导入提示对照</button><button id="export">导出提示对照</button><button id="palette">调色板对照</button><button id="measure">记录控件位置</button></nav>
<output id="measurements" style="display:none"></output>
<script type="module">
import {UI} from '/source/shared/ui/ui.js';
import {PALETTE} from '/source/shared/config.js';
const ui=new UI({pickColor(color){ui.setColor(color);},setTool(tool){document.body.dataset.tool=tool;},selectSlot(){},toggle(){},setPaintChannel(){}});
ui.modal=document.querySelector('#modal');ui.hotbar=document.querySelector('#hotbar');ui._dock();
ui.setHotbar(['cube','slope','corner','heavy','glass','drive3','steer3','mg3','laser3','light'],0);ui.setColor(PALETTE[0].hex);
document.querySelector('#import').onclick=()=>{ui.closePopovers();ui.openImport(()=>{});};
document.querySelector('#export').onclick=()=>{ui.closePopovers();ui.openExport('FKZC1:REFERENCE','赤焰 GT');};
document.querySelector('#palette').onclick=e=>{e.stopPropagation();ui.closeModal();document.querySelector('#colorBtn').click();};
function box(e){const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height};}
document.querySelector('#measure').onclick=async e=>{
 e.stopPropagation();await document.fonts.ready;
 const card=document.querySelector('#modal.show .card'),palette=document.querySelector('#colorPop.show');
 const result={viewport:{w:innerWidth,h:innerHeight}};
 result.dock=box(document.querySelector('#dock'));result.tools=box(document.querySelector('#tools'));
 result.hotbar=box(document.querySelector('#hotbar'));result.paint=box(document.querySelector('#paintControls'));
 result.toggle=box(document.querySelector('#toggles'));
 if(card){
  const p=card.querySelector('.hint'),ctx=document.createElement('canvas').getContext('2d');
  result.card=box(card);result.hint=box(p);result.textarea=box(card.querySelector('textarea'));result.actions=box(card.querySelector('.actions'));
  result.runs=[...p.childNodes].map(node=>{
   const element=node.nodeType===Node.TEXT_NODE?p:node,style=getComputedStyle(element);ctx.font=style.font;
   const range=document.createRange();range.selectNodeContents(node);const r=range.getBoundingClientRect();const text=node.textContent;
   const m=ctx.measureText(text.trim());return {text,font:style.font,size:parseFloat(style.fontSize),lineHeight:style.lineHeight,box:{x:r.x,y:r.y,w:r.width,h:r.height},advance:m.width,ascent:m.fontBoundingBoxAscent,descent:m.fontBoundingBoxDescent};
  });
 }else if(palette){
  result.palette=box(palette);result.label=box(palette.querySelector('.lbl'));result.grid=box(palette.querySelector('.swatches'));
  result.swatches=[...palette.querySelectorAll('.sw')].map(e=>({box:box(e),hex:Number(e.dataset.hex),selected:e.classList.contains('on')}));
 }
 document.querySelector('#measurements').textContent=JSON.stringify(result);
};
</script>
