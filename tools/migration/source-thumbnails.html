<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>原版零件缩略图离线导出</title>
<style>body{font:16px system-ui;background:#1b1d22;color:#f4f5f7;margin:28px}button{padding:12px}#tiles{display:grid;grid-template-columns:repeat(auto-fill,140px);gap:8px}figure{margin:0;background:repeating-conic-gradient(#353a42 0% 25%,#242830 0% 50%) 0/20px 20px;text-align:center}img{width:112px;height:112px}figcaption{background:#15171b;font-size:12px;padding:4px}</style>
<script type="importmap">{"imports":{"three":"/source/three/vendor/three/build/three.module.js","three/addons/":"/source/three/vendor/three/addons/","@shared/":"/source/shared/"}}</script>
<h1>原版零件缩略图离线导出</h1>
<p>执行原网页的模型加载与透明缩略图渲染器。导出到当前 UrhoX 工程的临时目录，检查后再导入正式资源。</p>
<button id="export">导出原版透明缩略图</button><p id="status">等待开始</p><div id="tiles"></div>
<script type="module">
import { PART_LIST } from '@shared/parts/defs.js';
import { loadWeaponModels } from '@shared/parts/weaponModels.js';
import { loadWheelModels } from '@shared/parts/wheelModels.js';
import { loadTrackModels } from '@shared/parts/trackModels.js';
import { loadThrusterModels } from '@shared/parts/thrusterModels.js';
import { loadHoverModels } from '@shared/parts/hoverModels.js';
import { loadLegModels } from '@shared/parts/legModels.js';
import { loadMechModels } from '@shared/parts/mechModels.js';
import { loadWingModels } from '@shared/parts/wingModels.js';
import { loadPlateModels } from '@shared/parts/plateModels.js';
import { loadScorpionModels } from '@shared/parts/scorpionModels.js';
import { loadRotorModels } from '@shared/parts/rotorModels.js';
import { loadHoverTexture } from '/source/three/src/parts/hoverFx.js';
import { loadThrusterTexture } from '/source/three/src/parts/thrusterFx.js';
import { loadEquipmentSurface } from '/source/three/src/parts/equipmentSurface.js';
import { renderThumbnails } from '/source/three/src/ui/thumbnails.js';
const button=document.querySelector('#export'),status=document.querySelector('#status');
button.onclick=async()=>{
  button.disabled=true;
  try {
    status.textContent='正在加载原版模型与贴图';
    const assets=name=>new URL(`/source/shared/assets/${name}/`,location.href).href;
    await Promise.all([loadWeaponModels(assets('weapons')),loadWheelModels(assets('wheels')),
      loadTrackModels(assets('tracks')),loadThrusterModels(assets('thrusters')),
      loadHoverModels(assets('hovers')),loadLegModels(assets('legs')),
      loadMechModels(assets('mechlegs')),loadWingModels(assets('wings')),loadPlateModels(assets('plates')),
      loadScorpionModels(assets('scorpion')),loadRotorModels(assets('rotor')),
      loadHoverTexture(),loadThrusterTexture(),loadEquipmentSurface()]);
    status.textContent='正在调用原版 112×112 透明渲染器';
    await new Promise(requestAnimationFrame);
    const thumbs=renderThumbnails(),images={};
    const fragment=document.createDocumentFragment();
    for(const def of PART_LIST) {
      images[def.id]=thumbs[def.id];
      const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');
      img.src=thumbs[def.id];img.alt=def.id;caption.textContent=def.name+' · '+def.id;
      figure.append(img,caption);fragment.append(figure);
    }
    document.querySelector('#tiles').replaceChildren(fragment);
    const response=await fetch('/export',{method:'POST',headers:{'Content-Type':'application/json','X-Export-Token':'__EXPORT_TOKEN__'},body:JSON.stringify({size:112,images})});
    if(!response.ok) throw Error(await response.text());
    const result=await response.json();status.textContent=`已导出 ${result.count} 张原版透明 PNG，共 ${result.bytes} 字节`;
  } catch(error) {status.textContent='导出失败：'+error.message;console.error(error);button.disabled=false;}
};
</script></html>
