<!doctype html><meta charset="utf-8"><title>装配轮胎尺寸对照</title>
<style>body{background:#18202b;color:white;font:16px system-ui;margin:16px}canvas{width:960px;max-width:100%}button{padding:8px}</style>
<script type="importmap">{"imports":{"three":"/source/three/vendor/three/build/three.module.js","@shared/":"/source/shared/"}}</script>
<h1>H5 原装配 · 同机位轮廓对照</h1><p>赤焰 GT，正交机位，仅替换为平涂材质以比较尺寸。未修改模型或装配缩放。</p>
<button id="capture">生成对照截图</button><p id="status">等待生成</p><div id="images"></div>
<script type="module">
import * as T from 'three';
import {VehicleView} from '/source/three/src/build/vehicleView.js';
import {Blueprint} from '@shared/build/blueprint.js';
import {buildRaceCar} from '@shared/build/prefab.js';
import {loadWheelModels} from '@shared/parts/wheelModels.js';
import {loadWeaponModels} from '@shared/parts/weaponModels.js';
import {loadThrusterModels} from '@shared/parts/thrusterModels.js';
const status=document.querySelector('#status');
document.querySelector('#capture').onclick=async()=>{try{
 status.textContent='正在使用原 H5 装配器生成';
 await Promise.all([loadWheelModels('/source/shared/assets/wheels/'),loadWeaponModels('/source/shared/assets/weapons/'),loadThrusterModels('/source/shared/assets/thrusters/')]);
 const view=new VehicleView();view.rebuild(buildRaceCar(new Blueprint()));
 const scene=new T.Scene();scene.background=new T.Color('#18202b');scene.add(view.root);
 const paints={rubber:0x555555,paint:0xda3434,armorWhite:0xbbbbbb};
 scene.traverse(o=>{if(!o.isMesh)return;if(o.userData.thrusterFx||o.userData.hoverField){o.visible=false;return;}o.material=new T.MeshBasicMaterial({color:paints[o.userData.slot]??0x9caabb});});
 const renderer=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1280,800);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;
 const camera=new T.OrthographicCamera(-8,8,5,-5,.1,100);
 const images={};
 for(const [name,position,up,target] of [['front',[0,3,20],[0,1,0],[0,3,0]],['top',[0,20,0],[0,0,1],[0,0,0]],['angle',[11,9,16],[0,1,0],[0,2.5,0]]]){
  camera.position.set(...position);camera.up.set(...up);camera.lookAt(...target);renderer.render(scene,camera);
  images[name]=renderer.domElement.toDataURL('image/png');const img=document.createElement('img');img.src=images[name];img.style.width='640px';img.alt=name;document.querySelector('#images').append(img);
 }
 const response=await fetch('/capture',{method:'POST',headers:{'Content-Type':'application/json','X-Probe-Token':'__TOKEN__'},body:JSON.stringify(images)});
 if(!response.ok)throw Error(await response.text());status.textContent='三张 H5 装配截图已保存';renderer.dispose();view.clear();
 }catch(error){status.textContent=error.stack;console.error(error);}};
</script>
